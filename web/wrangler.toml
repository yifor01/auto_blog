# Cloudflare Workers 靜態資產部署（Workers Static Assets）。
# CF 的 Git 整合在 web/（Root directory / Path）跑 `npm run build` 產出 dist/，
# 再用 `npx wrangler deploy` 把 dist/ 當靜態站部署。
# name 必須與你在 CF 建立的 Worker 同名，否則會部署到別的 Worker。
name = "auto-post-blog"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
