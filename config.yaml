pinned_organizations:        # 頂尖 AI 公司官方 blog 免評分置頂（比對 ContentItem.organization）
  - OpenAI
  - Anthropic
  - Google                   # 同時命中 Google / Google DeepMind
  - DeepSeek
  - Meta                     # 同時命中 Meta AI
  - xAI
  - Mistral
  - Alibaba                  # Qwen 官方 blog（cn_labs collector）
  - Zhipu AI                 # 智譜 GLM（官網無可用端點，佔位）
  - Moonshot AI              # Kimi（暫無 feed，佔位）
  - MiniMax                  # cn_labs collector 已接上，不再是佔位
# 5 → 8：加入 Anthropic News / Claude Blog 後，實測重放顯示 OpenAI 已常態佔滿
# 5 個名額，超限者被 hits[:limit] 截掉；而跨日去重（lookback_days: 7）會讓被截的
# 官方文隔天補不回來，等於永久遺失。
pinned_daily_limit: 8
lists:                       # 清單型來源（不評分，天然訊號排序）
  github_top_k: 10
  hf_top_k: 10
  other_papers_limit: 30
dedup:
