llm:
  api_url: https://openrouter.ai/api/v1
  max_tokens: 8192
  request_delay_seconds: 8.0
  # 評分 chain（需穩定輸出 JSON，越快越好）— 由上而下降級
  # 2026-07-14 更新：gpt-oss-120b:free 已下架、gemma-4-31b 被 Google AI Studio 池限流。
  # 選 model 硬規則：同一條 chain 的 fallback 必須掛在不同上游 provider（共用上游的 fallback 不是 fallback）。
  # :free 變體的上游 provider 只能從 429 body 的 provider_name 實測得知（models API 查不到）。
  scoring_models:
    - openai/gpt-oss-20b:free                # 上游 Darkbloom；JSON 乾淨、快
    - google/gemma-4-26b-a4b-it:free         # 上游 Darkbloom / Google AI Studio
    - nvidia/nemotron-3-super-120b-a12b:free # 上游 Nvidia；120B 最後備援（較慢）
  # 生成 chain（繁中品質優先）
  # 2026-08-11 更新：tencent/hy3:free 轉為純付費（endpoints=0，呼叫回 404 並提示改用 tencent/hy3），
  # 換上 nemotron-3-ultra。首選與第 3 位同為上游 Nvidia，違反上面的硬規則是刻意的——
  # 當前 :free 池只剩 15 個 model，繁中寫作實測能用的僅此一個（ling-3.0-tiny 回空字串、
  # gemma-4-31b 上游 429），中間隔著 Darkbloom/Google 與 Agnes，整條 chain 仍跨 3 個上游。
  generation_models:
    - nvidia/nemotron-3-ultra-550b-a55b:free # 上游 Nvidia；繁中台灣用語實測自然（550B，~26s）
    - google/gemma-4-26b-a4b-it:free         # 上游 Darkbloom / Google AI Studio
    - nvidia/nemotron-3-super-120b-a12b:free # 上游 Nvidia
    - agnes-2.0-flash                        # Agnes（apihub.agnes-ai.com）：免費 model 全掛時的可用性保險，寫作品質佳
  # Legacy：GeneratedContent.model_used 顯示 / UI 舊 code 仍讀這些 key
  model: openai/gpt-oss-20b:free
  generation_model: nvidia/nemotron-3-ultra-550b-a55b:free
collectors:
  # 外部文章正文抓取的字元上限（rss / blogs / hackernews / reddit 共用）。
  # 原為寫死的 2000，實測 18 個 RSS 來源全部撞頂且斷在句中；一般新聞全文約 3000-9000 字元。
  # 截斷點會退到句界，不會斷在字中間。
  abstract_max_chars: 8000
  arxiv:
    enabled: true
    categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.CV
    max_results: 50
  chatpaper:
    enabled: true
    base_url: https://chatpaper.com/api/v1/articles/list
    categories:
    - id: 2
      name: AI
    - id: 3
      name: Computation and Language
    - id: 4
      name: Computer Vision and Pattern Recognition
    - id: 91
      name: Information Retrieval
    page_size: 30
  hf_papers:
    enabled: true
  rss:
    enabled: true
    feeds:
    - name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - name: The Verge AI
      url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - name: OpenAI Blog
      url: https://openai.com/blog/rss.xml
    - name: Google AI Blog
      url: https://blog.google/technology/ai/rss/
    - name: HN AI
      url: https://hnrss.org/newest?q=AI+LLM+GPT+agent
      max_age_hours: 24
    - name: HuggingFace Blog
      url: https://huggingface.co/blog/feed.xml
    - name: Google Research
      url: https://blog.research.google/feeds/posts/default
    - name: MarkTechPost
      url: https://www.marktechpost.com/feed/
    - name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
    - name: KDnuggets
      url: https://www.kdnuggets.com/feed
    - name: Anthropic Engineering
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
    - name: Anthropic Research
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml
    - name: Anthropic News
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    - name: Claude Blog
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_claude.xml
    - name: Meta AI Research
      url: https://engineering.fb.com/category/ai-research/feed/
    - name: Apple ML
      url: https://machinelearning.apple.com/rss.xml
    - name: NVIDIA Developer
      url: https://developer.nvidia.com/blog/feed/
    - name: AWS ML
      url: https://aws.amazon.com/blogs/machine-learning/feed/
    - name: BAIR
      url: https://bair.berkeley.edu/blog/feed.xml
    - name: Interconnects
      url: https://www.interconnects.ai/feed
    # 原始發布站。substack 鏡像（importai.substack.com）在 Cloudflare 挑戰後面，
    # 會對 Python client 的 TLS 指紋回 403（換 UA / 開 HTTP2 都無效，curl 才過）。
    - name: Import AI
      url: https://jack-clark.net/feed/
    - name: The Gradient
      url: https://thegradient.pub/rss/
    - name: Dwarkesh
      url: https://www.dwarkesh.com/feed
    - name: Max Woolf
      url: https://minimaxir.com/index.xml
    - name: 量子位
      url: https://www.qbitai.com/feed
    # 中國 AI 產業的英文分析（Substack）。同區的 ChinAI（chinai.substack.com）
    # 回 200 但 0 item，與 Import AI 同一個 Cloudflare 坑，故不收。
    - name: Recode China AI
      # substack 主網域在 Cloudflare 挑戰後面（cf-mitigated: challenge），
      # 專案的 httpx client 一律 403，靜默斷線 120 天 0 筆。作者已搬到自訂
      # 網域，該網域不吃挑戰——同 Interconnects 模式。詳見 docs/sources.md
      url: https://www.recodechinaai.com/feed
    # ↓ 2026-08-11 新增（survey 見 docs/sources.md）。同批候選的
    # thezvi.substack.com/feed 用本專案 client 實測 11/11 回 Cloudflare
    # "Just a moment..." 403，與 Import AI / ChinAI 同坑，故不收。
    - name: Mistral AI
      url: https://mistral.ai/rss.xml
    - name: Google DeepMind
      url: https://deepmind.google/blog/rss.xml
    - name: Microsoft Research
      url: https://www.microsoft.com/en-us/research/feed/
    - name: Together AI
      url: https://www.together.ai/blog/rss.xml
    - name: Amazon Science
      url: https://www.amazon.science/index.rss
    # 正確路徑是根目錄 /feed，/blog/feed 是 404。
    - name: Databricks
      url: https://www.databricks.com/feed
    # 訊噪比低（量子運算／密碼學／益智題約佔 40-45%），刻意不進
    # pinned_organizations 也不進 top_institutions，全靠規則+LLM 評分過濾。
    - name: IBM Research
      url: https://research.ibm.com/rss
    - name: Stability AI
      url: https://stability.ai/news-updates?format=rss
    - name: Ars Technica AI
      url: https://arstechnica.com/ai/feed/
    # substack 本尊（thezvi.substack.com）在 Cloudflare 挑戰後面且無自訂網域，
    # 只能走這個 WordPress 鏡像，內容與時間戳同步。
    - name: Don't Worry About the Vase
      url: https://thezvi.wordpress.com/feed/
  blogs:
    enabled: true
    sources:
    - name: Naval Ravikant
      url: https://nav.al/
    - name: Andrej Karpathy
      url: https://karpathy.github.io/
    - name: 寶玉 baoyu.io
      url: https://baoyu.io/
    - name: Lilian Weng (OpenAI)
      url: https://lilianweng.github.io/
    - name: Jay Alammar
      url: https://jalammar.github.io/
    - name: Sebastian Raschka
      url: https://magazine.sebastianraschka.com/
    - name: Simon Willison
      url: https://simonwillison.net/
    - name: Eugene Yan
      url: https://eugeneyan.com/
    - name: Hamel Husain
      url: https://hamel.dev/
    - name: Latent Space
      url: https://www.latent.space/
  # 中國 AI 實驗室官方 blog：官網都是 CSR SPA，無 RSS 也爬不到 HTML，
  # 只能打前端自己用的 JSON API（端點寫在 cn_labs_collector.py）。
  # ByteDance Seed 與智譜（zhipuai.cn）查無可用端點，故未列入。
  cn_labs:
    enabled: true
    sources:
    - qwen
    - minimax
    - deepseek           # 官方公告（api-docs 子站）。deepseek.ai 是第三方彙整站，非官方
    - kimi               # Moonshot AI（kimi.com/blog）
    max_age_days: 7      # 兩家 API 都一次回全部歷史文章，不濾會每天灌舊文
  hackernews:
    enabled: true
    queries:
    - AI
    - LLM
    - GPT
    - RAG
    - Agent
    - OpenAI
    - DeepMind
    - Anthropic
    - Claude
    - Gemini
    - transformer
    - Cursor
    min_points: 50
    max_results: 30
  github:
    enabled: true
    languages:
    - python
    - typescript
    - rust
  reddit:
    enabled: true
    subreddits:
    - LocalLLaMA
    - MachineLearning
    - artificial
    - ChatGPT
    - OpenAI
    - Anthropic
    - StableDiffusion
    min_upvotes: 50
    max_results: 30
    time_filter: day
  newsapi:
    enabled: true
    query: generative AI OR LLM OR large language model OR AI agent OR OpenAI OR Anthropic OR Claude OR Gemini OR GPT OR DeepSeek OR Qwen
    language: en
    max_results: 30
    sort_by: relevancy
    # 免費 Developer 方案文章有 ~24h 延遲，查當天必回 0 筆（HTTP 200 但
    # totalResults=0，不會報錯）。往回退 2 天取已沉澱完整的一天；付費方案可設 0
    lag_days: 2
  semantic_scholar:
    enabled: true
    queries:
    - large language model
    - LLM
    - generative AI
    - AI agent
    - reasoning model
    - diffusion model
    fields_of_study:
    - Computer Science
    days_back: 3
    limit: 30
