[project]
name = "auto-post-blog"
version = "0.1.0"
description = "自動收集 GenAI 新知，篩選高價值內容，產出部落格貼文草稿與個人 AI 筆記"
requires-python = ">=3.11"
dependencies = [
    # typer 0.25 起改用 vendored click（typer.Exit 不再是 click.exceptions.Exit），
    # 上限鎖住直到程式碼與測試一併遷移。
    "typer>=0.15.0,<0.25",
    "httpx>=0.28.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "feedparser>=6.0,<7.0",
    "arxiv>=2.0,<3.0",
    "openai>=1.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<15.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-dotenv>=1.0,<2.0",
    # ⚠️ 上限是 `<1.3.2`，不是 `<1.4`——**1.3.2 就已經改了轉換字典**（2026-07-31
    # 對全語料 32,950 個去重欄位實測：1.3.1→1.3.2 有 50 筆差異，1.3.1→1.4.1 有 65 筆，
    # 兩者的主要變更幾乎完全重疊）。原本的 `<1.4` 擋不住該擋的東西。
    #
    # 1.3.2 起 s2twp 詞庫新增 `B超 → 超音波`（醫學 B 型超音波）且**無詞邊界保護**：
    #   753B超大参数 → 753超音波大參數    70B超越了GPT-4 → 70超音波越了GPT-4
    # `7B`/`70B`/`405B` 是本專案最核心的術語形狀，後接「超大/超強/超越」是極自然的
    # 中文搭配，而且**不可逆**（`753超音波大` 無法反推原本是 B）。
    # 由 tests/test_to_traditional.py::TestOpenCCVersionGuard 釘住，裝錯版本會紅。
    #
    # 1.3.2 確實有改對的部分（想象→想像、市場營銷→市場行銷、臺積電→台積電），
    # 已改用 `_TERM_FIXES` / `_VARIANT_FIXES` 條目在 1.3.1 上收割，不需要升版。
    "opencc>=1.1,<1.3.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0,<1.0",
    # fastapi 對 starlette 只寫 >=0.46.0（無上限）。starlette 1.0 移除了
    # `TemplateResponse(name, {"request": ...})` 舊簽名，而 src/web/app.py 全部用舊簽名
    # → 裝到 1.x 每個頁面都會炸 `TypeError: unhashable type: 'dict'`。
    "starlette>=0.46.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "markdown-it-py>=3.0.0,<5.0",
    "python-multipart>=0.0.9,<1.0",
]
# 測試專用（非執行期依賴）。tests/test_web/ 會 import src.web.app，
# 所以必須連 web extras 一起裝，否則 CI 會在 collect 階段就 ImportError。
test = [
    "auto-post-blog[web]",
    "pytest>=8.0,<10.0",
]

[project.scripts]
autopb = "src.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
