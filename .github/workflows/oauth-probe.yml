name: OAuth Probe (temporary)

# 臨時驗證：Actions 上的 claude CLI 能否單靠 CLAUDE_CODE_OAUTH_TOKEN 環境變數認證
# （本機走 ~/.claude/.credentials.json，證明不了這件事），順便量測乾淨環境的
# per-session input token overhead——本機那台裝了大量 skill/rules，48k 不具代表性。
#
# 用 push 觸發而非 workflow_dispatch：dispatch 要求 workflow 檔存在於 default branch，
# 這支只活在 feature branch 上。驗證完即刪除本檔。
on:
  push:
    branches: [feat/batch-generation-claude-code]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Probe auth + measure overhead
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          claude --version
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret 未設定或為空"
            exit 1
          fi
          echo '請只回覆兩個字元：OK' | claude -p \
            --model sonnet \
            --allowed-tools "" \
            --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
            --output-format json > probe.json
          python3 - <<'PY'
          import json
          d = json.load(open("probe.json"))
          if d.get("is_error"):
              raise SystemExit(f"::error::CLI 回報錯誤: {str(d.get('result'))[:300]}")
          result = (d.get("result") or "").strip()
          if not result:
              raise SystemExit("::error::result 為空")
          u = d.get("usage", {})
          overhead = (u.get("input_tokens", 0)
                      + u.get("cache_creation_input_tokens", 0)
                      + u.get("cache_read_input_tokens", 0))
          print(f"AUTH OK        result={result[:60]!r}")
          print(f"OVERHEAD       input_tokens={overhead}  output_tokens={u.get('output_tokens')}")
          print(f"COST           total_cost_usd={d.get('total_cost_usd')}")
          print(f"28 篇 / 7 批估算 cost ≈ {(d.get('total_cost_usd') or 0) * 7:.2f} USD（僅 overhead 部分）")
          PY
