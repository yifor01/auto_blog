name: Monthly Cleanup

on:
  schedule:
    - cron: '0 0 1 * *'   # 每月 1 號 UTC 00:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Clean old data
        run: python -m src.cli clean --keep-days 90 --auto

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ output/
          git diff --cached --quiet || git commit -m "chore: cleanup data older than 90 days"
          git pull --rebase
          git push

  notify-failure:
    needs: cleanup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[pipeline-failure] Monthly Cleanup 失敗';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title.includes('[pipeline-failure] Monthly Cleanup'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再次失敗 — ${today}\nRun: ${runUrl}`
              });
              console.log(`已追加留言至 Issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## Monthly Cleanup 失敗\n\n- **日期**：${today}\n- **Run URL**：${runUrl}\n- **失敗 Job**：cleanup\n\n請前往 Run URL 查看詳情並修復。`
              });
              console.log(`已開新 Issue #${created.number}`);
            }
