name: Daily Pipeline

on:
  schedule:
    - cron: '47 5 * * *'   # UTC 05:47 = 台灣 13:47（2026-07-09 從 18:00 改離峰：18:00 撞 OpenRouter 免費池尖峰+GitHub 整點壅塞→429 限流拖破 90min timeout。詳見 lessons.md）
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，空白=今天'
        required: false
      force:
        description: '強制重跑 (true/false)'
        default: 'false'

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          FORCE="${{ github.event.inputs.force }}"
          CMD="python -m src.cli run"
          [ -n "$DATE" ] && CMD="$CMD --date $DATE"
          [ "$FORCE" = "true" ] && CMD="$CMD --force"
          $CMD

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/scored/ data/bookmarks.json output/posts/ output/digests/ output/blogs/
          git diff --cached --quiet || git commit -m "chore: pipeline $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((5 * 2 ** i))
          done

  notify-failure:
    needs: pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[pipeline-failure] Daily Pipeline 失敗';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title.includes('[pipeline-failure] Daily Pipeline'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再次失敗 — ${today}\nRun: ${runUrl}`
              });
              console.log(`已追加留言至 Issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## Daily Pipeline 失敗\n\n- **日期**：${today}\n- **Run URL**：${runUrl}\n- **失敗 Job**：pipeline\n\n請前往 Run URL 查看詳情並修復。`
              });
              console.log(`已開新 Issue #${created.number}`);
            }

# 網站部署由 Cloudflare Pages 的 Git 整合處理：CF 偵測到 push 後自動
# build（web/，NODE_VERSION=20）並部署。不在此 workflow 內做 deploy。
