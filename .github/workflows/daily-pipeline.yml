name: Daily Pipeline

on:
  schedule:
    - cron: '13 17 * * *'   # UTC 17:13 = 台灣 01:13（2026-09-02 從 05:47 改回夜間並錯開整點；生成已改走 Claude Code CLI，OpenRouter 尖峰風險大減，評分仍走 OpenRouter）
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，空白=今天'
        required: false
      force:
        description: '強制重跑 (true/false)'
        default: 'false'

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 115  # job 上限 = step 100 + setup/commit 餘裕；超時歷史見 lessons.md

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e . -c constraints.txt

      # 無條件安裝（約 20-30s）：批次生成的開關在 config.yaml，workflow 讀不到它。
      # 裝了但 llm.batch_generation.enabled=false 時只是沒被叫到，不影響 pipeline。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        timeout-minutes: 100  # timeout 設在 step 層級：超時只砍此步（job 記 failure），Commit results 與 notify-failure 照跑
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 批次生成用；未設定時 claude CLI 起不來，generate 會逐篇退回 OpenRouter。
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          FORCE="${{ github.event.inputs.force }}"
          CMD="python -m src.cli run"
          [ -n "$DATE" ] && CMD="$CMD --date $DATE"
          [ "$FORCE" = "true" ] && CMD="$CMD --force"
          $CMD

      - name: Commit results
        if: always()  # pipeline 超時/失敗也 commit 已完成的 checkpoint（raw/scored/部分 posts），重跑同日期可續傳
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/scored/ data/bookmarks.json output/posts/ output/digests/ output/blogs/ output/lists/
          git diff --cached --quiet || git commit -m "chore: pipeline $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((5 * 2 ** i))
          done

  notify-failure:
    needs: pipeline
    if: failure() || cancelled()  # job 層級 timeout 會記為 cancelled 而非 failure，兩者都要通知
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[pipeline-failure] Daily Pipeline 失敗';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title.includes('[pipeline-failure] Daily Pipeline'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再次失敗 — ${today}（pipeline job 結果：${{ needs.pipeline.result }}）\nRun: ${runUrl}`
              });
              console.log(`已追加留言至 Issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## Daily Pipeline 失敗\n\n- **日期**：${today}\n- **Run URL**：${runUrl}\n- **失敗 Job**：pipeline（結果：${{ needs.pipeline.result }}，cancelled 通常代表 timeout）\n\n請前往 Run URL 查看詳情並修復。`
              });
              console.log(`已開新 Issue #${created.number}`);
            }

# 網站部署由 Cloudflare Pages 的 Git 整合處理：CF 偵測到 push 後自動
# build（web/，NODE_VERSION=20）並部署。不在此 workflow 內做 deploy。
